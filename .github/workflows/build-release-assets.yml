name: Build macOS release assets

'on':
  push:
    tags:
      - 'v*-functional.*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the verified packages as a prerelease
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 120
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Require complete UI acceptance before publishing
        if: ${{ github.event_name != 'push' && inputs.publish_release }}
        run: python3 Scripts/check-ui-acceptance.py
      - name: Require current functional acceptance for a functional tag
        if: ${{ github.event_name == 'push' }}
        run: python3 Scripts/check-functional-acceptance.py
      - name: Read release version
        id: version
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Resources/Info.plist)"
          releaseTag="v$version"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            releaseTag="$GITHUB_REF_NAME"
            python3 - "$version" "$releaseTag" <<'PY'
          import re, sys
          assert re.fullmatch(r'v' + re.escape(sys.argv[1]) + r'-functional\.[1-9][0-9]*', sys.argv[2])
          PY
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$releaseTag" >> "$GITHUB_OUTPUT"
      - name: Check build host
        run: |
          test "$(uname -m)" = arm64
          sw_vers
          xcodebuild -version
          python3 --version
          if ! command -v cmake >/dev/null; then brew install cmake; fi
          if ! command -v rg >/dev/null; then brew install ripgrep; fi
          cmake --version
          rg --version
          df -h .
      - name: Prepare fixed account components
        run: zsh Scripts/prepare-account-components.zsh
      - name: Run local regression
        env:
          TALKTUCK_UI_LANGUAGE: zh-Hans
        run: |
          mkdir -p .build
          python3 Scripts/check-localization.py
          zsh Scripts/test-localization.zsh
          python3 Tests/LanguagePolicySmoke.py
          python3 Scripts/test-recording-entry.py
          python3 Scripts/test-ui-contracts.py
          python3 Scripts/test-agent-setup.py
          zsh Scripts/test-service-namespace.zsh
          zsh Scripts/test-library-management.zsh
      - name: Build and sign application packages
        run: |
          COHEAR_STAGE_ONLY=1 TALKTUCK_BUILD_APP_PATH="$PWD/.build/local/TalkTuck.app" \
            zsh Scripts/build.zsh
      - name: Verify release assets
        run: |
          TALKTUCK_BUILD_APP_PATH="$PWD/.build/local/TalkTuck.app" zsh Scripts/verify-release.zsh
      - uses: actions/upload-artifact@v4
        with:
          name: TalkTuck-${{ steps.version.outputs.version }}-arm64
          path: |
            dist/TalkTuck-${{ steps.version.outputs.version }}-arm64.dmg
            dist/TalkTuck-${{ steps.version.outputs.version }}-arm64.dmg.sha256
            dist/TalkTuck-${{ steps.version.outputs.version }}-arm64.pkg
            dist/TalkTuck-${{ steps.version.outputs.version }}-arm64.pkg.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    if: ${{ github.event_name == 'push' || inputs.publish_release }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: TalkTuck-${{ needs.build.outputs.version }}-arm64
          path: dist
      - name: Verify downloaded packages
        run: |
          (cd dist && sha256sum -c TalkTuck-${{ needs.build.outputs.version }}-arm64.dmg.sha256)
          (cd dist && sha256sum -c TalkTuck-${{ needs.build.outputs.version }}-arm64.pkg.sha256)
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            cp Docs/releases/functional-preview.md release-notes.md
          else
          cat > release-notes.md <<'EOF'
          TalkTuck ${{ needs.build.outputs.version }} for Apple Silicon and macOS 14 or later.

          The app downloads and verifies its speech models on first use; model weights are not included in these packages.

          The app uses ad-hoc signing and is not Apple notarized. macOS may require manual approval before opening it.

          Both packages passed the repository's regression and build checks. SHA-256 files are attached for download verification.
          EOF
          fi
          gh release create "$RELEASE_TAG" \
            dist/TalkTuck-${{ needs.build.outputs.version }}-arm64.dmg \
            dist/TalkTuck-${{ needs.build.outputs.version }}-arm64.dmg.sha256 \
            dist/TalkTuck-${{ needs.build.outputs.version }}-arm64.pkg \
            dist/TalkTuck-${{ needs.build.outputs.version }}-arm64.pkg.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "TalkTuck $RELEASE_VERSION · $([[ "$GITHUB_EVENT_NAME" == push ]] && echo 功能验证版 || echo 预发布)" \
            --notes-file release-notes.md \
            --prerelease
