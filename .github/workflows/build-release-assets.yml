name: Build macOS release assets

'on':
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the verified packages as a prerelease
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Read release version
        id: version
        run: echo "version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Resources/Info.plist)" >> "$GITHUB_OUTPUT"
      - name: Check build host
        run: |
          test "$(uname -m)" = arm64
          sw_vers
          xcodebuild -version
          python3 --version
          if ! command -v cmake >/dev/null; then brew install cmake; fi
          cmake --version
          df -h .
      - name: Prepare fixed account components
        run: zsh Scripts/prepare-account-components.zsh
      - name: Run local regression
        run: |
          mkdir -p .build
          python3 Scripts/test-recording-entry.py
      - name: Build and sign application packages
        run: |
          COHEAR_STAGE_ONLY=1 RECORD_AI_BUILD_APP_PATH="$PWD/.build/local/RecordAI.app" \
            zsh Scripts/build.zsh
      - name: Verify release assets
        run: |
          codesign --verify --deep --strict .build/local/RecordAI.app
          hdiutil verify dist/RecordAI-${{ steps.version.outputs.version }}-arm64.dmg
          (cd dist && shasum -c RecordAI-${{ steps.version.outputs.version }}-arm64.dmg.sha256)
          (cd dist && shasum -c RecordAI-${{ steps.version.outputs.version }}-arm64.pkg.sha256)
          pkgutil --expand dist/RecordAI-${{ steps.version.outputs.version }}-arm64.pkg .build/pkg-expanded
          file .build/local/RecordAI.app/Contents/MacOS/RecordAIApp
          file .build/local/RecordAI.app/Contents/MacOS/recordai
      - uses: actions/upload-artifact@v4
        with:
          name: RecordAI-${{ steps.version.outputs.version }}-arm64
          path: |
            dist/RecordAI-${{ steps.version.outputs.version }}-arm64.dmg
            dist/RecordAI-${{ steps.version.outputs.version }}-arm64.dmg.sha256
            dist/RecordAI-${{ steps.version.outputs.version }}-arm64.pkg
            dist/RecordAI-${{ steps.version.outputs.version }}-arm64.pkg.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    if: ${{ inputs.publish_release }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: RecordAI-${{ needs.build.outputs.version }}-arm64
          path: dist
      - name: Verify downloaded packages
        run: |
          (cd dist && sha256sum -c RecordAI-${{ needs.build.outputs.version }}-arm64.dmg.sha256)
          (cd dist && sha256sum -c RecordAI-${{ needs.build.outputs.version }}-arm64.pkg.sha256)
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          RecordAI ${{ needs.build.outputs.version }} for Apple Silicon and macOS 14 or later.

          The app downloads and verifies its speech models on first use; model weights are not included in these packages.

          The app uses ad-hoc signing and is not Apple notarized. macOS may require manual approval before opening it.

          Both packages passed the repository's regression and build checks. SHA-256 files are attached for download verification.
          EOF
          gh release create v${{ needs.build.outputs.version }} \
            dist/RecordAI-${{ needs.build.outputs.version }}-arm64.dmg \
            dist/RecordAI-${{ needs.build.outputs.version }}-arm64.dmg.sha256 \
            dist/RecordAI-${{ needs.build.outputs.version }}-arm64.pkg \
            dist/RecordAI-${{ needs.build.outputs.version }}-arm64.pkg.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title 'RecordAI ${{ needs.build.outputs.version }}' \
            --notes-file release-notes.md \
            --prerelease
